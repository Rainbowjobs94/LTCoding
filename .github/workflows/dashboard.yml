name: Dashboard build

on:
  push:
    paths:
      - 'docs/dashboard/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'docs/dashboard/**'
      - '.github/workflows/dashboard.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
